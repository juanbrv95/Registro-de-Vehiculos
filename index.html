<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Registro de Vehículos</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <!-- Bootstrap 5 -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
</head>
<body class="container mt-4">

    <h2 class="mb-3">Registro de Obleas</h2>

    <!-- CAMPO DE BÚSQUEDA Y BOTÓN -->
    <div class="row mb-3 align-items-center">
        <div class="col-md-8 mb-2 mb-md-0">
            <input type="search" class="form-control" id="buscar" placeholder="Buscar por nombre, patente, vehículo...">
        </div>
        <div class="col-md-4 text-md-end">
            <button id="btnMostrarForm" class="btn btn-success w-100 w-md-auto">Agregar Vehículo</button>
        </div>
    </div>

    <!-- FORMULARIO -->
    <form id="formVehiculo" class="border p-3 rounded mb-4 bg-white d-none">
        <h2 class="mb-3">Datos del Vehículo</h2>

        <div class="mb-2">
            <input type="text" id="nombre" class="form-control" placeholder="Nombre completo" required>
        </div>

        <div class="mb-2">
            <input type="text" id="vehiculo" class="form-control" placeholder="Vehículo (Ej: Toyota Hilux)" required>
        </div>

        <div class="mb-2">
            <input type="text" id="patente" class="form-control" placeholder="Patente" required>
        </div>

        <div class="mb-2">
            <input type="text" id="funcion" class="form-control" placeholder="Función (Ej: Docente, Alumno)" required>
        </div>

        <!-- NUEVO CAMPO EMAIL -->
        <div class="mb-2">
            <input type="email" id="email" class="form-control" placeholder="Correo electrónico" required>
        </div>

        <button type="submit" class="btn btn-primary">Guardar</button>
    </form>

    <!-- TABLA -->
    <div class="table-responsive">
        <table class="table table-striped table-bordered align-middle">
            <thead class="table-dark">
                <tr>
                    <th>Nombre</th>
                    <th>Vehículo</th>
                    <th>Patente</th>
                    <th>Función</th>
                    <th>Email</th>
                    <th>Estado</th>
                    <th>Acciones</th>
                </tr>
            </thead>

            <tbody id="tablaVehiculos"></tbody>
        </table>
    </div>

    <!-- EmailJS SDK -->
    <script src="https://cdn.jsdelivr.net/npm/@emailjs/browser@4/dist/email.min.js"></script>
    <script src="script.js"></script>

</body>
</html>
