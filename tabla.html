<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>CRUD Vehículos</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <!-- Bootstrap 5 -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
</head>
<body class="container mt-4">

    <h2 class="mb-3">Registro de Vehículos</h2>

    <!-- TABLA -->
    <table class="table table-striped table-bordered">
        <thead class="table-dark">
            <tr>
                <th>Nombre</th>
                <th>Vehículo</th>
                <th>Patente</th>
                <th>Función</th>
                <th>Estado</th>
                <th>Acciones</th>
            </tr>
        </thead>
        <tbody id="tablaVehiculos"></tbody>
    </table>

    <!-- BOTÓN AGREGAR -->
    <button id="btnMostrarForm" class="btn btn-success mb-3">Agregar</button>

    <!-- FORMULARIO -->
    <form id="formVehiculo" class="border p-3 d-none">
        <div class="mb-2">
            <input type="text" id="nombre" class="form-control" placeholder="Nombre" required>
        </div>
        <div class="mb-2">
            <input type="text" id="vehiculo" class="form-control" placeholder="Vehículo" required>
        </div>
        <div class="mb-2">
            <input type="text" id="patente" class="form-control" placeholder="Patente" required>
        </div>
        <div class="mb-2">
            <input type="text" id="funcion" class="form-control" placeholder="Función" required>
        </div>
        <button type="submit" class="btn btn-primary">Guardar</button>
    </form>

    <!-- EmailJS SDK -->
    <script src="https://cdn.jsdelivr.net/npm/@emailjs/browser@4/dist/email.min.js"></script>
    <script src="script.js"></script>
</body>
</html>
